name: Atualizar Radar de Concursos Médicos

on:
  schedule:
    # De hora em hora, no minuto 23: horários "redondos" (00:00, 12:00) ficam horas na fila do GitHub.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      max_details:
        description: 'Máximo de páginas de detalhe por site (host) nesta execução'
        required: false
        default: '150'

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-concursos-sul
  cancel-in-progress: false

env:
  FEED: public/data/concursos-sul.json
  FEED_PRODUCAO: https://concurseiro.zezasultratools.uk/data/concursos-sul.json

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      # Memória do robô (notícias já abertas, saúde das fontes): cache do Actions, não o git
      # (mudaria a cada hora). Se o cache sumir, o robô reabre as notícias aos poucos, dentro do orçamento.
      - name: Restaurar memória do robô
        uses: actions/cache/restore@v4
        with:
          path: scripts/data/radar-estado.json
          key: radar-estado-${{ github.run_id }}
          restore-keys: radar-estado-

      - name: Coletar concursos médicos
        run: npx tsx scripts/scrape-concursos-sul.ts --max-details=${{ github.event.inputs.max_details || '150' }}

      - name: Salvar memória do robô
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/data/radar-estado.json
          key: radar-estado-${{ github.run_id }}-${{ github.run_attempt }}

      # Fonte essencial falhando 3 execuções seguidas → issue (o GitHub avisa por e-mail); fecha quando voltar.
      - name: Alarmes de fontes
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/verificar-radar.ts

      # O site NÃO é republicado: o Caddy busca o feed direto no GitHub (infra/web/Caddyfile).
      - name: Commit e push se houver novidades
        id: commit
        run: |
          if git diff --quiet -- "$FEED"; then
            echo "Nenhuma mudança no Radar."
            exit 0
          fi
          NOVOS=$(node -e "const f=require('./$FEED');console.log(f.concursos.filter(c=>c.isNew).length)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FEED"
          git commit -m "chore(radar): atualiza concursos médicos (${NOVOS} novos nos últimos 7 dias)"
          for tentativa in 1 2 3; do
            if git push; then
              echo "publicado=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push recusado (tentativa ${tentativa}); integrando commits novos do remoto…"
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::error::Conflito ao integrar o remoto; a coleta desta execução não foi publicada."
              exit 1
            fi
            sleep $((tentativa * 5))
          done
          echo "::error::Não foi possível publicar o feed depois de 3 tentativas."
          exit 1

      # Garante que o app recebe o que foi coletado (a CDN do GitHub guarda até 5 min).
      - name: Conferir se o feed chegou ao site
        if: steps.commit.outputs.publicado == '1'
        run: |
          ESPERADO=$(node -p "require('./$FEED').generatedAt")
          for i in $(seq 1 20); do
            ATUAL=$(curl -fsS -m 20 "${FEED_PRODUCAO}?verificacao=$(date +%s)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).generatedAt)}catch{console.log('')}})" || true)
            if [ "$ATUAL" = "$ESPERADO" ]; then
              echo "Feed no ar em produção (generatedAt ${ATUAL})."
              exit 0
            fi
            echo "Produção ainda em '${ATUAL}' (esperado ${ESPERADO}); nova tentativa em 30 s…"
            sleep 30
          done
          echo "::error::O feed novo não apareceu em ${FEED_PRODUCAO} após 10 min. Verifique o serviço web na Railway e o proxy do Caddy."
          exit 1
