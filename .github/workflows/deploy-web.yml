name: Publicar app web (GitHub Pages)

# O GitHub Pages serve a versão LEGADA do app (sem contas), congelada na tag `pages-legado`,
# enquanto a nova versão (com login e nuvem) é construída e hospedada na Railway.
# Só o feed do Radar (public/data/concursos-sul.json) continua vindo de `main`, atualizado pelo robô.

on:
  workflow_run:
    workflows: ['Atualizar Radar de Concursos Médicos (Sul)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (versão legada congelada)
        uses: actions/checkout@v4
        with:
          ref: pages-legado

      - name: Feed do Radar mais recente (de main)
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- public/data/concursos-sul.json
          node -e "const f=require('./public/data/concursos-sul.json');console.log('Feed:', f.concursos.length, 'concursos, gerado em', f.generatedAt)"

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Testes (lógica + conteúdo)
        run: npm test

      - name: Build web + PWA
        env:
          # Site de projeto do GitHub Pages fica em /<nome-do-repositório>
          EXPO_BASE_URL: /${{ github.event.repository.name }}
        run: npm run build:web

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
